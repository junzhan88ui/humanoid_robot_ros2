controller_manager:

  ros__parameters:

    use_sim_time: true

    update_rate: 100


    joint_state_broadcaster:

      type: joint_state_broadcaster/JointStateBroadcaster


    humanoid_controller:

      type: joint_trajectory_controller/JointTrajectoryController



humanoid_controller:

  ros__parameters:

    use_sim_time: true

    joints:

      - left_hip_joint
      - right_hip_joint

      - left_knee_joint
      - right_knee_joint

      - left_shoulder_joint
      - right_shoulder_joint

      - left_elbow_joint
      - right_elbow_joint

      - neck_joint


    command_interfaces:

      - position


    state_interfaces:

      - position
      - velocity
